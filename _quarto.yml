editor: source

execute:
  cache: false
  freeze: false

project:
  type: website
  output-dir: docs
  render: [index.qmd]
  post-render: "R/.post-render.R"

title: "PMTiles"
keyword: >
  Spatial Data Science, Geospatial Data, Geospatial Analysis,
  Geospatial Visualization, PMTiles, Tippecanoe, R Programming

website:
  favicon: images/favicon.svg
  site-url: https://cem-usp.github.io/pmtiles/
  repo-url: https://github.com/cem-usp/pmtiles/
  issue-url: https://github.com/cem-usp/pmtiles/issues/
  open-graph:
    image: images/og-image.png
    image-width: 2400
    image-height: 1600
    image-alt: Center for Metropolitan Studies
  repo-branch: main
  repo-actions: [edit, source, issue]
  navbar: false
  sidebar: false

format:
  html:
    open-graph: true
    locale: en_US
    lang: en_US
    code-link: true
    code-fold: true
    tbl-cap-location: top
    callout-appearance: simple
    csl: csl/english-apa-author-date.csl
    fig-align: center
    link-external-newwindow: true
    theme: [default, brand, scss/styles.scss]
    include-in-header:
      text: |
        <meta property="og:description" content="">
        <meta property="og:image" content="https://cem-usp.github.io/pmtiles/images/og-image.png">
        <meta property="og:image:height" content="2400">
        <meta property="og:image:width" content="1600">

bibliography: references.bib
