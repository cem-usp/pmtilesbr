meta:
  name: PMTilesBR
  link:
    home: https://cem-usp.github.io/pmtilesbr/
    github: https://github.com/cem-usp/pmtilesbr
  description: |
    Geospatial tiled datasets for spatial visualization and analysis in Brazil.

color:
  palette:
    red: "#db5025"
    red-d10: "#b25544" # colorspace::darken("#db5025", 0.1)
    red-d25: "#994331" # colorspace::darken("#db5025", 0.25)
    red-d50: "#702611" # colorspace::darken("#db5025", 0.50)
    yellow: "#efd46a"
    yellow-d25: "#b39a00" # colorspace::darken("#efd46a", 0.25)
    yellow-d50: "#756400" # colorspace::darken("#efd46a", 0.50)
    black: "#070808"
    white: "#ffffff"
    gray: "#868489"
    gray-l50: "#c1bfc4" # colorspace::lighten("#868489", 0.50)
    gray-l75: "#b9b9b9"
    gray-l90: "#e2e2e2"
    gray-l95: "#f1f1f1"
  background: white
  primary: red
  secondary: black
  tertiary: yellow
  success: black
  info: black
  warning: black
  danger: black
  light: white
  dark: black

typography:
  fonts:
    - family: Nunito Sans
      source: google
      weight: [100, 200, 300, 400, 500, 600, 700, 800, 900]
    - family: Space Mono
      source: google
      weight: [100, 200, 300, 400, 500, 600, 700]
  base:
    family: Nunito Sans
    size: 1rem
    line-height: 1.5
    weight: normal
  headings:
    family: Nunito Sans
    color: red-d25
    line-height: 1.5
    weight: 900
  monospace: Space Mono
  monospace-inline:
    color: black
    background-color: gray-l95
  monospace-block:
    background-color: gray-l95
  link:
    color: yellow-d25
    decoration: none
